name: Set up vcpkg toolchain
description: >
  Install the pinned vcpkg baseline, Ninja and ccache, with binary-package and
  ccache caching. Mirrors the local workflow so CI resolves the same versions.

runs:
  using: composite
  steps:
    # vcpkg itself (the clone at the manifest's baseline plus the bootstrapped
    # vcpkg executable) is cached per baseline, so most jobs skip the clone
    # and the bootstrap. A Dependabot baseline bump changes the key.
    - name: Read the vcpkg baseline
      id: baseline
      shell: bash
      run: |
        sha="$(sed -n 's/.*"builtin-baseline": *"\([0-9a-f]*\)".*/\1/p' vcpkg.json)"
        if [ -z "$sha" ]; then
          echo "::error::vcpkg.json has no builtin-baseline"
          exit 1
        fi
        echo "sha=$sha" >> "$GITHUB_OUTPUT"

    - name: Cache vcpkg itself
      id: vcpkg-tool
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/vcpkg
        key: vcpkg-tool-${{ runner.os }}-${{ runner.arch }}-${{ steps.baseline.outputs.sha }}

    - name: Install vcpkg (Unix)
      if: runner.os != 'Windows' && steps.vcpkg-tool.outputs.cache-hit != 'true'
      shell: bash
      run: |
        BASELINE="${{ steps.baseline.outputs.sha }}"
        git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
        git -C "$HOME/vcpkg" fetch --quiet --depth 1 origin "$BASELINE"
        git -C "$HOME/vcpkg" checkout --quiet FETCH_HEAD
        "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

    - name: Install vcpkg (Windows)
      if: runner.os == 'Windows' && steps.vcpkg-tool.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $baseline = '${{ steps.baseline.outputs.sha }}'
        git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$env:USERPROFILE\vcpkg"
        git -C "$env:USERPROFILE\vcpkg" fetch --quiet --depth 1 origin $baseline
        git -C "$env:USERPROFILE\vcpkg" checkout --quiet FETCH_HEAD
        & "$env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

    - name: Point the build at vcpkg (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"
        echo "VCPKG_DEFAULT_BINARY_CACHE=${VCPKG_DEFAULT_BINARY_CACHE:-$PWD/vcpkg-binary-cache}" >> "$GITHUB_ENV"
        mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE:-$PWD/vcpkg-binary-cache}"

    - name: Point the build at vcpkg (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        "VCPKG_ROOT=$env:USERPROFILE\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        $cache = if ($env:VCPKG_DEFAULT_BINARY_CACHE) { $env:VCPKG_DEFAULT_BINARY_CACHE } else { "$pwd\vcpkg-binary-cache" }
        "VCPKG_DEFAULT_BINARY_CACHE=$cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        New-Item -ItemType Directory -Force $cache | Out-Null

    - name: Cache vcpkg binary packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-

    - name: Install Ninja and ccache (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ninja-build ccache

    - name: Install Ninja and ccache (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install ninja ccache

    - name: Cache ccache (Linux)
      if: runner.os == 'Linux'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/ccache
        key: ccache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-

    - name: Cache ccache (macOS)
      if: runner.os == 'macOS'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/Library/Caches/ccache
        key: ccache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          ccache-${{ runner.os }}-
