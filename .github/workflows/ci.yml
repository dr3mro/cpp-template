name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # The ci preset adds ASan/UBSan and turns warnings into errors.
      - name: Build and test (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake --preset ci
          cmake --build --preset ci
          ctest --preset ci

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake --preset release
          cmake --build --preset release
          ctest --preset release

  version:
    name: version matches vcpkg.json (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg
      - name: Compare the CMake project version with vcpkg.json
        # vcpkg.json is the single source of truth; the configure-time
        # version.hpp records the version project() actually received, so a
        # hard-coded VERSION in CMakeLists.txt (or a stale manifest) fails here.
        run: |
          cmake --preset debug-nosan -DMYAPP_BUILD_TESTS=OFF
          manifest="$(sed -n 's/^[[:space:]]*"version": "\([^"]*\)",*/\1/p' vcpkg.json)"
          project="$(grep -o 'kVersion = "[^"]*"' build/debug-nosan/generated/include/myapp/version.hpp | sed 's/.*"\(.*\)"/\1/')"
          echo "vcpkg.json: '$manifest'  CMake project: '$project'"
          if [ "$manifest" != "$project" ]; then
            echo "::error::vcpkg.json version ($manifest) and the CMake project version ($project) disagree"
            exit 1
          fi

  tsan:
    name: thread sanitizer (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg
      - run: |
          cmake --preset tsan
          cmake --build --preset tsan
          ctest --preset tsan

  coverage:
    name: coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg

      - name: Install LLVM (for llvm-profdata/llvm-cov)
        if: runner.os == 'Linux'
        # libclang-rt provides the profile/sanitizer runtimes the runner does not
        # guarantee; keep it in step with the clang version apt installs.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y llvm libclang-rt-dev

      - name: Generate coverage report
        run: |
          cmake --preset coverage
          cmake --build --preset coverage
          cmake --build --preset coverage --target coverage

      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.os }}
          path: build/coverage/html
          if-no-files-found: ignore

  tidy:
    name: clang-tidy (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y clang-tidy
      - name: Run clang-tidy
        # MYAPP_TIDY_WERROR makes findings fail the build; .clang-tidy keeps
        # warnings-as-errors off so editors still show them as warnings.
        run: |
          cmake --preset debug-nosan -DMYAPP_TIDY_WERROR=ON
          cmake --build --preset debug-nosan --target tidy

  fuzz:
    name: fuzz (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg
      - name: Install LLVM (for a fuzzer-capable clang)
        # libclang-rt provides the libFuzzer/ASan runtimes the runner does not
        # guarantee.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y llvm libclang-rt-dev
      - name: Run fuzzers
        run: |
          cmake --preset fuzz -DMYAPP_FUZZ_SECONDS=30
          cmake --build --preset fuzz
          cmake --build --preset fuzz --target fuzz-run

  format:
    name: format (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg
      - name: Install current clang-format (.clang-format needs v20+)
        run: pipx install clang-format
      - name: Check formatting
        # The format-check target owns the file list, so CI and a local run
        # cannot drift apart.
        run: |
          cmake --preset release
          cmake --build --preset release --target format-check
