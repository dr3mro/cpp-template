name: Build and publish binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the build artifacts as a GitHub Release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release tag (for example, v1.0.0); blank uses build-<run number>
        required: false
        type: string

permissions:
  contents: write

env:
  # Shared binary cache so the composite action can restore built packages.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

jobs:
  check-version:
    name: Check tag matches vcpkg.json version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare tag and vcpkg.json version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(jq -r .version vcpkg.json)"
          [ "$tag" = "$ver" ] || { echo "::error::tag v$tag does not match vcpkg.json version $ver"; exit 1; }

  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    # Every build waits for the tag check. A manual run (no tag) skips that
    # check, and always() keeps the skipped job from cancelling the build.
    needs: check-version
    if: >-
      always() &&
      (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
            cmake_args: "-DCMAKE_CXX_COMPILER=g++ -DVCPKG_TARGET_TRIPLET=x64-linux"
            extension: ""
          - os: linux
            arch: x86
            runner: ubuntu-latest
            # -m32 does not reach vcpkg's triplet detection, so it would install
            # x64-linux packages and fail at link time; name the triplet too.
            cmake_args: "-DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_FLAGS=-m32 -DVCPKG_TARGET_TRIPLET=x86-linux"
            extension: ""
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            cmake_args: "-DCMAKE_CXX_COMPILER=g++ -DVCPKG_TARGET_TRIPLET=arm64-linux"
            extension: ""
          - os: macos
            arch: x64
            runner: macos-14
            cmake_args: "-DCMAKE_CXX_COMPILER=clang++ -DCMAKE_OSX_ARCHITECTURES=x86_64 -DVCPKG_TARGET_TRIPLET=x64-osx"
            extension: ""
          - os: macos
            arch: arm64
            runner: macos-14
            cmake_args: "-DCMAKE_CXX_COMPILER=clang++ -DCMAKE_OSX_ARCHITECTURES=arm64 -DVCPKG_TARGET_TRIPLET=arm64-osx"
            extension: ""
          - os: windows
            arch: x64
            runner: windows-latest
            msvc_arch: amd64
            # The triplet names the packages to build: without it vcpkg would
            # use the one of the host, and the cross builds would link the
            # wrong libraries.
            cmake_args: "-DVCPKG_TARGET_TRIPLET=x64-windows"
            extension: ".exe"
          - os: windows
            arch: x86
            runner: windows-latest
            msvc_arch: amd64_x86
            cmake_args: "-DVCPKG_TARGET_TRIPLET=x86-windows"
            extension: ".exe"
          - os: windows
            arch: arm64
            runner: windows-latest
            msvc_arch: amd64_arm64
            cmake_args: "-DVCPKG_TARGET_TRIPLET=arm64-windows"
            extension: ".exe"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # replacing the per-OS vcpkg and Ninja install steps.
      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg

      - name: Install Linux 32-bit toolchain
        if: matrix.os == 'linux' && matrix.arch == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++-multilib

      - name: Configure MSVC
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build binary with CMake
        shell: bash
        run: |
          mkdir -p dist
          cmake --preset release -DMYAPP_BUILD_TESTS=OFF ${{ matrix.cmake_args }}
          cmake --build --preset release
          cp "build/release/myapp${{ matrix.extension }}" "dist/myapp-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.extension }}"

      # Windows users expect a .zip; everyone else gets a .tar.gz. Two steps,
      # because each one is written for its own shell.
      - name: Package binary (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $archive = "myapp-${{ matrix.os }}-${{ matrix.arch }}"
          Compress-Archive -Path "dist/$archive${{ matrix.extension }}" -DestinationPath "dist/$archive.zip" -Force

      - name: Package binary (Linux, macOS)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          archive="myapp-${{ matrix.os }}-${{ matrix.arch }}"
          tar -czf "dist/${archive}.tar.gz" -C dist "${archive}${{ matrix.extension }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myapp-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/myapp-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            dist/myapp-${{ matrix.os }}-${{ matrix.arch }}.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    # always(): on a manual run check-version is skipped, and a skipped job
    # further up would otherwise skip this one too, even after a good build.
    if: >-
      always() && needs.build.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/') || inputs.publish_release == true)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: myapp-*
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          generate_release_notes: true
          # A pushed tag (v1.2.0) names the release after itself; a manual run
          # uses the release_tag input, or build-<run number> when that is blank.
          tag_name: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
