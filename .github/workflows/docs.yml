name: Publish Doxygen documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Doxygen
        # ubuntu-latest already ships CMake 3.25+, which the workflow presets
        # require; ninja-build, doxygen and graphviz are the only extra tools.
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y doxygen graphviz ninja-build

      - name: Set up vcpkg
        # The docs preset builds the full app + library + tests configuration so
        # the architecture diagram includes every target, so the toolchain (and
        # doctest) must be available.
        uses: ./.github/actions/setup-vcpkg

      - name: Generate documentation
        run: cmake --workflow --preset docs

      - name: Mark documentation as static HTML
        run: touch docs/.nojekyll

      - name: Configure GitHub Pages
        # This workflow deploys the uploaded Doxygen artifact directly.
        # The repository Pages source must be set to "GitHub Actions"; if it
        # is set to a branch, GitHub starts a separate Jekyll build instead.
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
