name: Publish Doxygen documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install vcpkg
        # Pin vcpkg to the same baseline commit the manifest records, so CI
        # resolves identical dependency versions to a local machine.
        run: |
          BASELINE="$(python3 -c 'import json;print(json.load(open("vcpkg.json"))["builtin-baseline"])')"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          git -C "$HOME/vcpkg" fetch --quiet --depth 1 origin "$BASELINE"
          git -C "$HOME/vcpkg" checkout --quiet FETCH_HEAD
          "$HOME/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Install Doxygen
        # ubuntu-latest already ships CMake 3.25+, which the workflow presets
        # require; ninja-build, doxygen and graphviz are the only extra tools.
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y doxygen graphviz ninja-build

      - name: Generate documentation
        # The docs preset turns off tests, fuzzers and vcpkg installation, so
        # the toolchain file alone is enough for this build.
        run: cmake --workflow --preset docs

      - name: Mark documentation as static HTML
        run: touch docs/.nojekyll

      - name: Configure GitHub Pages
        # This workflow deploys the uploaded Doxygen artifact directly.
        # The repository Pages source must be set to "GitHub Actions"; if it
        # is set to a branch, GitHub starts a separate Jekyll build instead.
        uses: actions/configure-pages@v5

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
