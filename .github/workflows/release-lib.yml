name: Build and publish library packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the build artifacts as a GitHub Release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release tag (for example, v1.0.0); blank uses build-<run number>
        required: false
        type: string

permissions:
  contents: write

env:
  # Shared binary cache so the composite action can restore built packages.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

jobs:
  check-version:
    name: Check tag matches vcpkg.json version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare tag and vcpkg.json version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(jq -r .version vcpkg.json)"
          [ "$tag" = "$ver" ] || { echo "::error::tag v$tag does not match vcpkg.json version $ver"; exit 1; }

  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    # Every build waits for the tag check. A manual run (no tag) skips that
    # check, and always() keeps the skipped job from cancelling the build.
    needs: check-version
    # The template repo is an app, so a v* tag would otherwise also run the
    # library build here and attach same-named archives as the app release.
    # Generated library projects keep the guard too, but their repository name
    # differs, so the condition is always true for them.
    if: >-
      always() &&
      github.repository != 'dr3mro/cpp-template' &&
      (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
            cmake_args: "-DCMAKE_CXX_COMPILER=g++ -DVCPKG_TARGET_TRIPLET=x64-linux"
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            cmake_args: "-DCMAKE_CXX_COMPILER=g++ -DVCPKG_TARGET_TRIPLET=arm64-linux"
          - os: macos
            arch: x64
            runner: macos-14
            cmake_args: "-DCMAKE_CXX_COMPILER=clang++ -DCMAKE_OSX_ARCHITECTURES=x86_64 -DVCPKG_TARGET_TRIPLET=x64-osx"
          - os: macos
            arch: arm64
            runner: macos-14
            cmake_args: "-DCMAKE_CXX_COMPILER=clang++ -DCMAKE_OSX_ARCHITECTURES=arm64 -DVCPKG_TARGET_TRIPLET=arm64-osx"
          - os: windows
            arch: x64
            runner: windows-latest
            msvc_arch: amd64
            # The triplet names the packages to build: without it vcpkg would
            # use the one of the host, and the cross build would link the
            # wrong libraries.
            cmake_args: "-DVCPKG_TARGET_TRIPLET=x64-windows"
          - os: windows
            arch: arm64
            runner: windows-latest
            msvc_arch: amd64_arm64
            cmake_args: "-DVCPKG_TARGET_TRIPLET=arm64-windows"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # replacing the per-OS vcpkg and Ninja install steps.
      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg

      - name: Configure MSVC
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.msvc_arch }}

      # Build the library and install it into an isolated prefix. The installed
      # tree (headers + library + CMake package config) is what consumers use.
      - name: Build and install the library
        shell: bash
        run: |
          prefix="dist/myapp-${{ matrix.os }}-${{ matrix.arch }}"
          cmake --preset release -DMYAPP_BUILD_TESTS=OFF ${{ matrix.cmake_args }}
          cmake --build --preset release
          cmake --install build/release --prefix "$prefix"

      # A swapped vcpkg triplet or a wrong cross-compile flag still builds, but
      # for the wrong CPU. Check the installed library itself. `file` cannot do
      # this: for a static library it only says "current ar archive".
      - name: Check the library architecture (Linux, macOS)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          prefix="dist/myapp-${{ matrix.os }}-${{ matrix.arch }}"
          lib="$(find "$prefix" -type f \( -name '*.a' -o -name '*.so*' -o -name '*.dylib' \) | head -1)"
          if [ -z "$lib" ]; then
            echo "::error::no installed library found under $prefix"
            exit 1
          fi
          case "${{ matrix.os }}-${{ matrix.arch }}" in
            linux-x64)   out="$(objdump -f "$lib" | grep -m1 architecture)"; want='x86-64' ;;
            linux-arm64) out="$(objdump -f "$lib" | grep -m1 architecture)"; want='aarch64' ;;
            macos-x64)   out="$(lipo -info "$lib")"; want='x86_64' ;;
            macos-arm64) out="$(lipo -info "$lib")"; want='arm64' ;;
            *) echo "::error::no architecture check for ${{ matrix.os }}-${{ matrix.arch }}"; exit 1 ;;
          esac
          echo "$lib: $out"
          if ! grep -q -- "$want" <<<"$out"; then
            echo "::error::$lib is not ${{ matrix.arch }} (expected '$want')"
            exit 1
          fi

      # PowerShell, not bash: Git Bash would rewrite /headers as if it were a
      # path. dumpbin comes from the developer shell set up above.
      - name: Check the library architecture (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $prefix = "dist/myapp-${{ matrix.os }}-${{ matrix.arch }}"
          $lib = Get-ChildItem -LiteralPath $prefix -Recurse -File -Include *.lib, *.dll | Select-Object -First 1
          if (-not $lib) { throw "no installed library found under $prefix" }
          $want = @{ 'x64' = '8664 machine (x64)'; 'arm64' = 'AA64 machine (ARM64)' }['${{ matrix.arch }}']
          $out = dumpbin /headers $lib.FullName | Select-String -Pattern 'machine \(' | Select-Object -First 1
          "$($lib.FullName): $out"
          if (-not ("$out" -match [regex]::Escape($want))) {
            throw "$($lib.Name) is not ${{ matrix.arch }} (expected '$want')"
          }

      - name: Package library
        shell: bash
        run: |
          archive="myapp-${{ matrix.os }}-${{ matrix.arch }}"
          tar -czf "dist/${archive}.tar.gz" -C dist "${archive}"

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: myapp-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/myapp-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    # always(): on a manual run check-version is skipped, and a skipped job
    # further up would otherwise skip this one too, even after a good build.
    if: >-
      always() && needs.build.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/') || inputs.publish_release == true)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: myapp-*
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          # A pushed tag (v1.2.0) names the release after itself; a manual run
          # uses the release_tag input, or build-<run number> when that is blank.
          tag_name: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
