name: Release

# Builds the installable library package for every platform and, for a v* tag (or a manual run with
# publish_release ticked), publishes a GitHub Release. The work is done by
# release-build.yml, shared with app projects.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the build artifacts as a GitHub Release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release tag (for example, v1.0.0); blank uses build-<run number>
        required: false
        type: string

# The most any job of release-build.yml needs; each job there asks for less.
permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # The template repository is an app, so a v* tag would otherwise also run
    # the library release and attach same-named archives. Generated library
    # projects have another name, so this is always true for them.
    if: github.repository != 'dr3mro/cpp-template'
    uses: ./.github/workflows/release-build.yml
    with:
      mode: lib
      publish_release: ${{ inputs.publish_release || false }}
      release_tag: ${{ inputs.release_tag || '' }}
