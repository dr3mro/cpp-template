name: Build and publish library packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the build artifacts as a GitHub Release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release tag (for example, v1.0.0); blank uses build-<run number>
        required: false
        type: string

permissions:
  contents: write

env:
  # Shared binary cache so the composite action can restore built packages.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

jobs:
  check-version:
    name: Check tag matches vcpkg.json version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Compare tag and vcpkg.json version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(jq -r .version vcpkg.json)"
          [ "$tag" = "$ver" ] || { echo "::error::tag v$tag does not match vcpkg.json version $ver"; exit 1; }

  build:

    name: ${{ matrix.os }} ${{ matrix.arch }}
    # The template repo is an app, so a v* tag would otherwise also run the
    # library build here and attach same-named archives as the app release.
    # Generated library projects keep the guard too, but their repository name
    # differs, so the condition is always true for them.
    if: github.repository != 'dr3mro/cpp-template'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
            cmake_args: "-DCMAKE_CXX_COMPILER=g++ -DVCPKG_TARGET_TRIPLET=x64-linux"
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            cmake_args: "-DCMAKE_CXX_COMPILER=g++ -DVCPKG_TARGET_TRIPLET=arm64-linux"
          - os: macos
            arch: x64
            runner: macos-14
            cmake_args: "-DCMAKE_CXX_COMPILER=clang++ -DCMAKE_OSX_ARCHITECTURES=x86_64 -DVCPKG_TARGET_TRIPLET=x64-osx"
          - os: macos
            arch: arm64
            runner: macos-14
            cmake_args: "-DCMAKE_CXX_COMPILER=clang++ -DCMAKE_OSX_ARCHITECTURES=arm64 -DVCPKG_TARGET_TRIPLET=arm64-osx"
          - os: windows
            arch: x64
            runner: windows-latest
            msvc_arch: amd64
            # The triplet names the packages to build: without it vcpkg would
            # use the one of the host, and the cross build would link the
            # wrong libraries.
            cmake_args: "-DVCPKG_TARGET_TRIPLET=x64-windows"
          - os: windows
            arch: arm64
            runner: windows-latest
            msvc_arch: amd64_arm64
            cmake_args: "-DVCPKG_TARGET_TRIPLET=arm64-windows"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Pins vcpkg to the manifest baseline and adds binary/ccache caching,
      # replacing the per-OS vcpkg and Ninja install steps.
      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg

      - name: Configure MSVC
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      # Build the library and install it into an isolated prefix. The installed
      # tree (headers + library + CMake package config) is what consumers use.
      - name: Build and install the library
        shell: bash
        run: |
          prefix="dist/myapp-${{ matrix.os }}-${{ matrix.arch }}"
          cmake --preset release -DMYAPP_BUILD_TESTS=OFF ${{ matrix.cmake_args }}
          cmake --build --preset release
          cmake --install build/release --prefix "$prefix"
          lib="$(find "$prefix" -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.a' -o -name '*.lib' -o -name '*.dll' \) | head -1)"
          if [ -z "$lib" ]; then echo "::error::no installed library found under $prefix" >&2; exit 1; fi
          case "${{ matrix.os }}" in
            linux)
              out="$(objdump -f "$lib")"; echo "$out"
              case "${{ matrix.arch }}" in
                x64) echo "$out" | grep -m1 architecture | grep -q 'x86-64' ;;
                arm64) echo "$out" | grep -m1 architecture | grep -q 'aarch64' ;;
              esac ;;
            macos)
              out="$(lipo -info "$lib")"; echo "$out"
              case "${{ matrix.arch }}" in
                x64) echo "$out" | grep -q 'x86_64' ;;
                arm64) echo "$out" | grep -q 'arm64' ;;
              esac ;;
            windows)
              out="$(dumpbin /headers "$lib")"; echo "$out"
              case "${{ matrix.arch }}" in
                x64) echo "$out" | grep -q '8664 machine (x64)' ;;
                arm64) echo "$out" | grep -q 'AA64 machine (ARM64)' ;;
              esac ;;
          esac

      - name: Package library
        shell: bash
        run: |
          archive="myapp-${{ matrix.os }}-${{ matrix.arch }}"
          tar -czf "dist/${archive}.tar.gz" -C dist "${archive}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: myapp-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/myapp-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release == true
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: myapp-*
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          # A pushed tag (v1.2.0) names the release after itself; a manual run
          # uses the release_tag input, or build-<run number> when that is blank.
          tag_name: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
