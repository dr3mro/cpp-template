name: Build and publish library packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the build artifacts as a GitHub Release
        required: true
        type: boolean
        default: false
      release_tag:
        description: Release tag (for example, v1.0.0); blank uses build-<run number>
        required: false
        type: string

permissions:
  contents: write

env:
  # Shared binary cache so the composite action can restore built packages.
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
            cmake_args: "-DCMAKE_CXX_COMPILER=g++"
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            cmake_args: "-DCMAKE_CXX_COMPILER=g++"
          - os: macos
            arch: x64
            runner: macos-14
            cmake_args: "-DCMAKE_CXX_COMPILER=clang++ -DCMAKE_OSX_ARCHITECTURES=x86_64"
          - os: macos
            arch: arm64
            runner: macos-14
            cmake_args: "-DCMAKE_CXX_COMPILER=clang++ -DCMAKE_OSX_ARCHITECTURES=arm64"
          - os: windows
            arch: x64
            runner: windows-latest
            msvc_arch: amd64
            cmake_args: ""
          - os: windows
            arch: arm64
            runner: windows-latest
            msvc_arch: amd64_arm64
            cmake_args: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Pins vcpkg to the manifest baseline and adds binary/ccache caching,
      # replacing the per-OS vcpkg and Ninja install steps.
      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg

      - name: Configure MSVC
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      # Build the library and install it into an isolated prefix. The installed
      # tree (headers + library + CMake package config) is what consumers use.
      - name: Build and install the library
        shell: bash
        run: |
          prefix="dist/myapp-${{ matrix.os }}-${{ matrix.arch }}"
          cmake --preset release -DMYAPP_BUILD_TESTS=OFF ${{ matrix.cmake_args }}
          cmake --build --preset release
          cmake --install build/release --prefix "$prefix"

      - name: Package library
        shell: bash
        run: |
          archive="myapp-${{ matrix.os }}-${{ matrix.arch }}"
          tar -czf "dist/${archive}.tar.gz" -C dist "${archive}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: myapp-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/myapp-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release == true
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: myapp-*
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
          # A pushed tag (v1.2.0) names the release after itself; a manual run
          # uses the release_tag input, or build-<run number> when that is blank.
          tag_name: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || format('build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
