name: Template test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

jobs:
  generate-and-build:
    # Only run in the template repository itself; generated projects carry a
    # different name (and do not ship this workflow at all).
    if: github.repository == 'dr3mro/cpp-template'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg

      - name: Install extra tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang llvm libclang-rt-dev clang-tidy doxygen graphviz
          # Pinned to match the pre-commit hook rev, so CI and the local hook
          # agree on formatting. Keep both in step.
          pipx install clang-format==21.1.5

      - name: Install extra tools (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm doxygen graphviz

      - name: Generate projects from the template
        run: |
          ./scripts/new-project.sh app17 /tmp/app17 --std 17 --no-git
          ./scripts/new-project.sh app20 /tmp/app20 --std 20 --no-git
          ./scripts/new-project.sh mylib /tmp/mylib --no-git --lib

      - name: The PowerShell script produces the same project
        # scripts/new-project.ps1 must produce the same project as
        # new-project.sh, apart from the random Visual Studio GUID. Same names
        # as the bash projects above (in their own folders), so the only
        # difference left is the GUID.
        run: |
          pwsh -NoProfile -File scripts/new-project.ps1 app17 /tmp/ps/app17 -Std 17 -NoGit
          pwsh -NoProfile -File scripts/new-project.ps1 mylib /tmp/ps/mylib -NoGit -Lib

          masked() {
            cp -R "$1" "$2"
            find "$2" -type f -print0 | while IFS= read -r -d '' file; do
              if LC_ALL=C grep -qI . "$file" 2>/dev/null; then
                perl -pi -e 's/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}/<GUID>/g' "$file"
              fi
            done
          }
          masked /tmp/app17 /tmp/masked-bash-app
          masked /tmp/ps/app17 /tmp/masked-ps-app
          diff -r /tmp/masked-bash-app /tmp/masked-ps-app
          masked /tmp/mylib /tmp/masked-bash-lib
          masked /tmp/ps/mylib /tmp/masked-ps-lib
          diff -r /tmp/masked-bash-lib /tmp/masked-ps-lib

      - name: No placeholder names left behind
        # Every MYAPP/myapp must have been renamed; a miss means the script
        # (or a new file) still hard-codes the template name.
        run: |
          if grep -rIl 'myapp\|MYAPP' /tmp/app17 /tmp/app20 /tmp/mylib --exclude-dir=.git; then
            echo "::error::placeholder 'myapp'/'MYAPP' still present in generated projects"
            exit 1
          fi

      - name: Build and test every project
        # The ci preset is warnings-as-errors + ASan, so this fails on any
        # warning the template introduces.
        run: |
          for project in /tmp/app17 /tmp/app20 /tmp/mylib; do
            echo "::group::$project ci"
            (cd "$project" && cmake --preset ci && cmake --build --preset ci && ctest --preset ci)
            echo "::endgroup::"

            echo "::group::$project format-check"
            (cd "$project" && cmake --build --preset ci --target format-check)
            echo "::endgroup::"
          done

      - name: Library mode install and consume
        # `cmake --install build/release` uses the preset's installDir
        # (build/install/release); the consumer example builds into build/examples.
        run: |
          cd /tmp/mylib
          cmake --preset release
          cmake --build --preset release
          cmake --install build/release
          cmake -S examples -B build/examples -DCMAKE_PREFIX_PATH="$PWD/build/install/release"
          cmake --build build/examples
          ./build/examples/example

      - name: Library mode shared build
        # Uses the vcpkg toolchain so doctest is available and the tests link
        # against the shared library (exercising symbol visibility).
        run: |
          cd /tmp/mylib
          cmake -S . -B build/shared -G Ninja -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build/shared
          ctest --test-dir build/shared --output-on-failure

      - name: A consumer does not inherit the project's warning flags
        # The library's flags (-Wall, -Wshadow, ...) belong to this project: a
        # consumer that pulls it in with FetchContent must not get them, or
        # its own code fails to compile.
        run: |
          rm -rf /tmp/consumer
          mkdir -p /tmp/consumer
          cat > /tmp/consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.25)
          project(consumer LANGUAGES CXX)

          include(FetchContent)
          # A local directory instead of a download: the library project was
          # generated next to this one.
          set(FETCHCONTENT_SOURCE_DIR_MYLIB "/tmp/mylib")
          FetchContent_Declare(mylib)
          FetchContent_MakeAvailable(mylib)

          # Only -Werror: if the library's warning flags (-Wshadow, ...) leaked
          # into this project, the shadowing in main.cpp would be an error.
          add_compile_options(-Werror)

          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE mylib::mylib)
          EOF
          cat > /tmp/consumer/main.cpp <<'EOF'
          #include <mylib/core/greeter.hpp>

          int main()
          {
              int value = 1;
              {
                  int value = 2;  // shadows the outer value: -Wshadow warns here
                  (void)value;
              }
              return value;
          }
          EOF
          cmake -S /tmp/consumer -B /tmp/consumer/build
          cmake --build /tmp/consumer/build

      - name: Doxygen docs workflow
        run: (cd /tmp/app20 && cmake --workflow --preset docs)

      - name: Build a project in a folder with a space and special characters
        # A path with a space (and 'c++') breaks the regular expressions that
        # clang-tidy and the coverage report use, and the paths in the Doxygen
        # configuration. Building there keeps that honest.
        run: |
          dir="/tmp/my c++ (work)/spc"
          rm -rf "$dir"
          mkdir -p "$dir"
          ./scripts/new-project.sh spaced "$dir/spaced" --no-git
          cd "$dir/spaced"
          cmake --preset debug
          cmake --build --preset debug
          ctest --preset debug
          cmake --build --preset debug --target tidy
          cmake --workflow --preset docs

      - name: clang-tidy (Linux)
        if: runner.os == 'Linux'
        run: |
          cd /tmp/app20
          # Generated projects rename the MYAPP_ option prefix, so derive it
          # from the project name instead of hard-coding the template's.
          PREFIX="$(echo app20 | tr '[:lower:]' '[:upper:]')"
          cmake --preset debug-nosan -D"${PREFIX}_TIDY_WERROR=ON"
          cmake --build --preset debug-nosan --target tidy

      - name: Coverage (Linux)
        if: runner.os == 'Linux'
        run: |
          cd /tmp/app20
          cmake --preset coverage
          cmake --build --preset coverage
          cmake --build --preset coverage --target coverage

      - name: Fuzz (Linux)
        if: runner.os == 'Linux'
        run: |
          cd /tmp/app20
          # Same renaming applies to the fuzz option prefix.
          PREFIX="$(echo app20 | tr '[:lower:]' '[:upper:]')"
          cmake --preset fuzz -D"${PREFIX}_FUZZ_SECONDS=10"
          cmake --build --preset fuzz
          cmake --build --preset fuzz --target fuzz-run

  windows-compiler-guard:
    # A plain PowerShell window is not a developer shell. CMake must stop with
    # its own explanation instead of picking a clang++ from PATH and failing
    # later with STL1000 from the Visual Studio standard library.
    if: github.repository == 'dr3mro/cpp-template'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg

      - name: CMake refuses to guess the compiler outside a developer shell
        shell: pwsh
        run: |
          # This job deliberately does not configure MSVC: the environment is
          # a plain PowerShell window, like the one the error message is for.
          cmake --preset release -DMYAPP_BUILD_TESTS=OFF 2>&1 | Tee-Object -Variable log
          $code = $LASTEXITCODE
          $text = ($log | Out-String)
          if ($code -eq 0) {
            throw "cmake --preset release succeeded outside a developer shell; the compiler guard did not run"
          }
          if ($text -match 'STL1000') {
            throw "the build failed with STL1000 instead of the developer-shell message"
          }
          if ($text -notmatch 'No Visual Studio compiler') {
            $text
            throw "cmake did not print the developer-shell error message"
          }
          if ($text -notmatch 'Launch-VsDevShell\.ps1') {
            throw "the developer-shell error message does not say how to open one"
          }
          if ($text -notmatch 'Launch-VsDevShell\.ps1.*-SkipAutomaticLocation') {
            throw "the developer-shell error message does not use -SkipAutomaticLocation"
          }
          # cmake failing was the expected outcome. Without this the step
          # exits with cmake's exit code (Actions ends pwsh scripts with
          # "exit $LASTEXITCODE") and fails although every check passed.
          exit 0

  visual-studio:
    # The checked-in Visual Studio solution must build with MSBuild, without
    # CMake being run first. This job is the only place it can be verified:
    # MSBuild needs Windows.
    if: github.repository == 'dr3mro/cpp-template'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v7
      # The developer-shell step runs a CMake configure, which needs vcpkg and
      # the VCPKG_DEFAULT_BINARY_CACHE folder (set workflow-wide) to exist.
      - uses: ./.github/actions/setup-vcpkg
      - uses: microsoft/setup-msbuild@v2

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ contains(matrix.os, 'arm') && 'arm64' || 'x64' }}

      - name: Generate projects from the template
        shell: bash
        run: |
          ./scripts/new-project.sh vsapp "$RUNNER_TEMP/vsapp" --no-git
          ./scripts/new-project.sh vslib "$RUNNER_TEMP/vslib" --no-git --lib

      - name: Generate the projects with the PowerShell script
        shell: pwsh
        run: |
          # Windows PowerShell 5.1 and PowerShell 7 must produce the same
          # project as the bash script.
          foreach ($shell in @('powershell', 'pwsh')) {
            & $shell -ExecutionPolicy Bypass -File scripts\new-project.ps1 vsapp "$env:RUNNER_TEMP\psapp-$shell" -NoGit
            & $shell -ExecutionPolicy Bypass -File scripts\new-project.ps1 vslib "$env:RUNNER_TEMP\pslib-$shell" -NoGit -Lib
          }

      - name: The PowerShell script produces the same project as the bash script
        shell: pwsh
        run: |
          function Get-MaskedCopy([string]$Dir, [string]$Name) {
              $copy = Join-Path $env:RUNNER_TEMP $Name
              # Copy-Item into an existing folder nests the copy inside it, so
              # always start from a clean destination.
              if (Test-Path -LiteralPath $copy) { Remove-Item -LiteralPath $copy -Recurse -Force }
              Copy-Item -Recurse -Force -LiteralPath $Dir -Destination $copy
              Get-ChildItem -LiteralPath $copy -Recurse -File | ForEach-Object {
                  $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
                  if ($bytes -contains 0) { return }   # a binary file
                  $text = [System.Text.Encoding]::UTF8.GetString($bytes)
                  $text = $text -replace '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}', '<GUID>'
                  [System.IO.File]::WriteAllText($_.FullName, $text, (New-Object System.Text.UTF8Encoding $false))
              }
              return $copy
          }
          foreach ($pair in @(@('vsapp', 'psapp'), @('vslib', 'pslib'))) {
              $bash = Get-MaskedCopy "$env:RUNNER_TEMP\$($pair[0])" "masked-bash-$($pair[0])"
              foreach ($shell in @('powershell', 'pwsh')) {
                  $ps = Get-MaskedCopy "$env:RUNNER_TEMP\$($pair[1])-$shell" "masked-ps-$($pair[1])-$shell"
                  git diff --no-index --stat $bash $ps
                  if ($LASTEXITCODE -ne 0) {
                      git diff --no-index $bash $ps
                      throw "the PowerShell script and the bash script produce different projects ($($pair[0]), $shell)"
                  }
              }
          }

      - name: The PowerShell script accepts the bash-style options
        shell: pwsh
        run: |
          # The same command line has to work with both scripts: --std 20 must
          # produce the same project as -Std 20.
          & powershell -ExecutionPolicy Bypass -File scripts\new-project.ps1 bashopts "$env:RUNNER_TEMP\bashopts-dashes" --std 20 --lib --no-git
          & powershell -ExecutionPolicy Bypass -File scripts\new-project.ps1 bashopts "$env:RUNNER_TEMP\bashopts-ps" -Std 20 -Lib -NoGit

          function Get-MaskedCopy([string]$Dir, [string]$Name) {
              $copy = Join-Path $env:RUNNER_TEMP $Name
              if (Test-Path -LiteralPath $copy) { Remove-Item -LiteralPath $copy -Recurse -Force }
              Copy-Item -Recurse -Force -LiteralPath $Dir -Destination $copy
              Get-ChildItem -LiteralPath $copy -Recurse -File | ForEach-Object {
                  $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
                  if ($bytes -contains 0) { return }
                  $text = [System.Text.Encoding]::UTF8.GetString($bytes)
                  $text = $text -replace '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}', '<GUID>'
                  [System.IO.File]::WriteAllText($_.FullName, $text, (New-Object System.Text.UTF8Encoding $false))
              }
              return $copy
          }
          $dashes = Get-MaskedCopy "$env:RUNNER_TEMP\bashopts-dashes" 'masked-bashopts-dashes'
          $ps = Get-MaskedCopy "$env:RUNNER_TEMP\bashopts-ps" 'masked-bashopts-ps'
          git diff --no-index --stat $dashes $ps
          if ($LASTEXITCODE -ne 0) {
              git diff --no-index $dashes $ps
              throw "--std 20 --lib --no-git and -Std 20 -Lib -NoGit produce different projects"
          }

      - name: The printed next steps work in Windows PowerShell 5.1
        shell: pwsh
        run: |
          # Windows PowerShell 5.1 is the default shell on Windows, and it has
          # no && operator: a printed command that uses it is a parse error
          # there. The developer shell must also keep the current folder, or
          # the CMake commands run in the wrong one.
          & powershell -ExecutionPolicy Bypass -File scripts\new-project.ps1 nextsteps "$env:RUNNER_TEMP\nextsteps" -NoGit 2>&1 | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) { throw "new-project.ps1 failed under Windows PowerShell 5.1" }
          $text = ($log | Out-String)
          $bad = $log | Where-Object { $_ -match '\&\&' }
          if ($bad) {
            $bad
            throw "the printed next steps use &&, which Windows PowerShell 5.1 cannot parse"
          }
          if ($text -notmatch '-SkipAutomaticLocation') {
            throw "the printed developer shell does not use -SkipAutomaticLocation"
          }

      - name: The developer shell makes CMake pick MSVC
        shell: pwsh
        run: |
          # Inside a developer shell, cl.exe comes from the tools that shell
          # set up, not from whichever clang++ or g++ is earlier on PATH.
          # The generated project renames the MYAPP_ prefix to VSAPP_.
          Push-Location "$env:RUNNER_TEMP\vsapp"
          try {
            cmake --preset release -DVSAPP_BUILD_TESTS=OFF
            if ($LASTEXITCODE -ne 0) { throw "cmake --preset release failed in the developer shell" }
            $cache = Get-Content build/release/CMakeCache.txt -Raw
            if ($cache -notmatch 'CMAKE_CXX_COMPILER:FILEPATH=.*cl\.exe') {
              throw "the developer shell did not make CMake pick MSVC"
            }
          } finally {
            Pop-Location
          }

      - name: No placeholder names left behind
        shell: bash
        run: |
          if grep -rIl 'myapp\|MYAPP' "$RUNNER_TEMP/vsapp" "$RUNNER_TEMP/vslib" --exclude-dir=.git --exclude-dir=build; then
            echo "::error::placeholder 'myapp'/'MYAPP' still present in generated projects"
            exit 1
          fi

      # A git repository per project, so that the check after the build can see
      # which files the build created. The files are committed, not just
      # staged: a staged file still shows up in "git status" as added, which
      # would make the check report every file of the project.
      - name: Prepare the projects for the output check
        shell: pwsh
        run: |
          foreach ($project in @('vsapp', 'vslib')) {
            Push-Location "$env:RUNNER_TEMP\$project"
            git init -q
            git add -A
            git -c user.name=CI -c user.email=ci@example.com commit -q -m "Baseline before the build"
            Pop-Location
          }

      # PowerShell, not bash: setup-msbuild puts msbuild on the Windows PATH,
      # and Git Bash would also rewrite /p: switches as if they were paths.
      - name: Build the app project with MSBuild
        shell: pwsh
        run: |
          $platform = if ($env:RUNNER_ARCH -eq 'ARM64' -or $env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'ARM64' } else { 'x64' }
          foreach ($config in @('Debug', 'Release')) {
            msbuild "$env:RUNNER_TEMP\vsapp\vsapp.sln" -p:Configuration=$config -p:Platform=$platform -m | Tee-Object -Variable log
            if ($LASTEXITCODE -ne 0) { throw "msbuild failed for vsapp ($config)" }
            # The solution must build without CMake.
            if ($log -match 'cmake(\.exe)?"?\s+-') { throw "the Visual Studio build of vsapp ran CMake" }
            # The wildcards are supported because the project is read-only.
            if ($log -match 'Wildcards and/or some other MSBuild constructs') { throw "the Visual Studio build of vsapp warned about wildcards" }
            Push-Location "$env:RUNNER_TEMP\vsapp"
            $extra = git status --porcelain --ignored | Where-Object { $_ -notmatch '^!! build/' }
            Pop-Location
            if ($extra) { $extra; throw "msbuild wrote files outside build/vs" }
          }

      - name: A new source file is still discovered
        shell: pwsh
        run: |
          # Automatic discovery has to survive the read-only project: add a
          # file under src/ and build again. MSBuild evaluates the wildcard on
          # every run, so no project edit or IDE reload is needed here.
          $source = "$env:RUNNER_TEMP\vsapp\src\vsapp\core\discovered.cpp"
          @'
          namespace vsapp::core
          {
              int discovered()
              {
                  return 1;
              }
          }
          '@ | Set-Content -LiteralPath $source -Encoding utf8
          $platform = if ($env:RUNNER_ARCH -eq 'ARM64' -or $env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'ARM64' } else { 'x64' }
          msbuild "$env:RUNNER_TEMP\vsapp\vsapp.sln" -p:Configuration=Release -p:Platform=$platform -m | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed after adding a source file" }
          if ($log -match 'Wildcards and/or some other MSBuild constructs') { throw "the rebuild warned about wildcards" }
          $obj = Get-ChildItem "$env:RUNNER_TEMP\vsapp\build\vs\obj" -Recurse -Filter discovered.obj
          if (-not $obj) { throw "the new source file src/vsapp/core/discovered.cpp was not compiled" }

      - name: Build the library project with MSBuild
        shell: pwsh
        run: |
          $platform = if ($env:RUNNER_ARCH -eq 'ARM64' -or $env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'ARM64' } else { 'x64' }
          foreach ($config in @('Debug', 'Release')) {
            msbuild "$env:RUNNER_TEMP\vslib\vslib.sln" -p:Configuration=$config -p:Platform=$platform -m | Tee-Object -Variable log
            if ($LASTEXITCODE -ne 0) { throw "msbuild failed for vslib ($config)" }
            # The solution must build without CMake.
            if ($log -match 'cmake(\.exe)?"?\s+-') { throw "the Visual Studio build of vslib ran CMake" }
            # The wildcards are supported because the project is read-only.
            if ($log -match 'Wildcards and/or some other MSBuild constructs') { throw "the Visual Studio build of vslib warned about wildcards" }
            Push-Location "$env:RUNNER_TEMP\vslib"
            $extra = git status --porcelain --ignored | Where-Object { $_ -notmatch '^!! build/' }
            Pop-Location
            if ($extra) { $extra; throw "msbuild wrote files outside build/vs" }
          }

      - name: Build the project of the PowerShell script with MSBuild
        shell: pwsh
        run: |
          $platform = if ($env:RUNNER_ARCH -eq 'ARM64' -or $env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'ARM64' } else { 'x64' }
          msbuild "$env:RUNNER_TEMP\psapp-pwsh\vsapp.sln" -p:Configuration=Release -p:Platform=$platform -m | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed for the project of the PowerShell script" }
          # The solution must build without CMake.
          if ($log -match 'cmake(\.exe)?"?\s+-') { throw "the Visual Studio build of the PowerShell project ran CMake" }
          # The wildcards are supported because the project is read-only.
          if ($log -match 'Wildcards and/or some other MSBuild constructs') { throw "the Visual Studio build of the PowerShell project warned about wildcards" }
