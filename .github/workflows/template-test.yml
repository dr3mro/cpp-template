name: Template test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache

jobs:
  generate-and-build:
    # Only run in the template repository itself; generated projects carry a
    # different name (and do not ship this workflow at all).
    if: github.repository == 'dr3mro/cpp-template'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vcpkg

      - name: Install extra tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang llvm libclang-rt-dev clang-tidy doxygen graphviz
          # Pinned to match the pre-commit hook rev, so CI and the local hook
          # agree on formatting. Keep both in step.
          pipx install clang-format==21.1.5

      - name: Install extra tools (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm doxygen graphviz

      - name: Generate projects from the template
        run: |
          ./scripts/new-project.sh app17 /tmp/app17 --std 17 --no-git
          ./scripts/new-project.sh app20 /tmp/app20 --std 20 --no-git
          ./scripts/new-project.sh mylib /tmp/mylib --no-git --lib

      - name: No placeholder names left behind
        # Every MYAPP/myapp must have been renamed; a miss means the script
        # (or a new file) still hard-codes the template name.
        run: |
          if grep -rIl 'myapp\|MYAPP' /tmp/app17 /tmp/app20 /tmp/mylib --exclude-dir=.git; then
            echo "::error::placeholder 'myapp'/'MYAPP' still present in generated projects"
            exit 1
          fi

      - name: Build and test every project
        # The ci preset is warnings-as-errors + ASan, so this fails on any
        # warning the template introduces.
        run: |
          for project in /tmp/app17 /tmp/app20 /tmp/mylib; do
            echo "::group::$project ci"
            (cd "$project" && cmake --preset ci && cmake --build --preset ci && ctest --preset ci)
            echo "::endgroup::"

            echo "::group::$project format-check"
            (cd "$project" && cmake --build --preset ci --target format-check)
            echo "::endgroup::"
          done

      - name: Library mode install and consume
        # `cmake --install build/release` uses the preset's installDir
        # (build/install/release); the consumer example builds into build/examples.
        run: |
          cd /tmp/mylib
          cmake --preset release
          cmake --build --preset release
          cmake --install build/release
          cmake -S examples -B build/examples -DCMAKE_PREFIX_PATH="$PWD/build/install/release"
          cmake --build build/examples
          ./build/examples/example

      - name: Library mode shared build
        # Uses the vcpkg toolchain so doctest is available and the tests link
        # against the shared library (exercising symbol visibility).
        run: |
          cd /tmp/mylib
          cmake -S . -B build/shared -G Ninja -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake --build build/shared
          ctest --test-dir build/shared --output-on-failure

      - name: Doxygen docs workflow
        run: (cd /tmp/app20 && cmake --workflow --preset docs)

      - name: clang-tidy (Linux)
        if: runner.os == 'Linux'
        run: |
          cd /tmp/app20
          # Generated projects rename the MYAPP_ option prefix, so derive it
          # from the project name instead of hard-coding the template's.
          PREFIX="$(echo app20 | tr '[:lower:]' '[:upper:]')"
          cmake --preset debug-nosan -D"${PREFIX}_TIDY_WERROR=ON"
          cmake --build --preset debug-nosan --target tidy

      - name: Coverage (Linux)
        if: runner.os == 'Linux'
        run: |
          cd /tmp/app20
          cmake --preset coverage
          cmake --build --preset coverage
          cmake --build --preset coverage --target coverage

      - name: Fuzz (Linux)
        if: runner.os == 'Linux'
        run: |
          cd /tmp/app20
          # Same renaming applies to the fuzz option prefix.
          PREFIX="$(echo app20 | tr '[:lower:]' '[:upper:]')"
          cmake --preset fuzz -D"${PREFIX}_FUZZ_SECONDS=10"
          cmake --build --preset fuzz
          cmake --build --preset fuzz --target fuzz-run

  visual-studio:
    # The checked-in Visual Studio solution must build with MSBuild, without
    # CMake being run first. This job is the only place it can be verified:
    # MSBuild needs Windows.
    if: github.repository == 'dr3mro/cpp-template'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v2

      - name: Generate projects from the template
        shell: bash
        run: |
          ./scripts/new-project.sh vsapp "$RUNNER_TEMP/vsapp" --no-git
          ./scripts/new-project.sh vslib "$RUNNER_TEMP/vslib" --no-git --lib

      - name: No placeholder names left behind
        shell: bash
        run: |
          if grep -rIl 'myapp\|MYAPP' "$RUNNER_TEMP/vsapp" "$RUNNER_TEMP/vslib" --exclude-dir=.git; then
            echo "::error::placeholder 'myapp'/'MYAPP' still present in generated projects"
            exit 1
          fi

      # A git repository per project, so that the check after the build can see
      # which files the build created. The files are committed, not just
      # staged: a staged file still shows up in "git status" as added, which
      # would make the check report every file of the project.
      - name: Prepare the projects for the output check
        shell: pwsh
        run: |
          foreach ($project in @('vsapp', 'vslib')) {
            Push-Location "$env:RUNNER_TEMP\$project"
            git init -q
            git add -A
            git -c user.name=CI -c user.email=ci@example.com commit -q -m "Baseline before the build"
            Pop-Location
          }

      # PowerShell, not bash: setup-msbuild puts msbuild on the Windows PATH,
      # and Git Bash would also rewrite /p: switches as if they were paths.
      - name: Build the app project with MSBuild
        shell: pwsh
        run: |
          foreach ($config in @('Debug', 'Release')) {
            msbuild "$env:RUNNER_TEMP\vsapp\vsapp.sln" -p:Configuration=$config -p:Platform=x64 -m
            if ($LASTEXITCODE -ne 0) { throw "msbuild failed for vsapp ($config)" }
            Push-Location "$env:RUNNER_TEMP\vsapp"
            $extra = git status --porcelain --ignored | Where-Object { $_ -notmatch '^!! build/' }
            Pop-Location
            if ($extra) { $extra; throw "msbuild wrote files outside build/vs" }
          }

      - name: Build the library project with MSBuild
        shell: pwsh
        run: |
          foreach ($config in @('Debug', 'Release')) {
            msbuild "$env:RUNNER_TEMP\vslib\vslib.sln" -p:Configuration=$config -p:Platform=x64 -m
            if ($LASTEXITCODE -ne 0) { throw "msbuild failed for vslib ($config)" }
            Push-Location "$env:RUNNER_TEMP\vslib"
            $extra = git status --porcelain --ignored | Where-Object { $_ -notmatch '^!! build/' }
            Pop-Location
            if ($extra) { $extra; throw "msbuild wrote files outside build/vs" }
          }
