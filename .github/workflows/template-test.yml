      - name: No placeholder names left behind
        shell: bash
        run: |
          if grep -rIl 'myapp\|MYAPP\|@AUTHOR@' \
             "$RUNNER_TEMP/vsapp" "$RUNNER_TEMP/vslib" "$RUNNER_TEMP/vsnovcpkg" \
             --exclude-dir=.git --exclude-dir=build; then
            echo "::error::placeholder 'myapp'/'MYAPP' still present in generated projects"
            exit 1
          fi

      # A git repository per project, so that the check after the build can see
      # which files the build created. The files are committed, not just
      # staged: a staged file still shows up in "git status" as added, which
      # would make the check report every file of the project.
      - name: Prepare the projects for the output check
        shell: pwsh
        run: |
          foreach ($project in @('vsapp', 'vslib')) {
            Push-Location "$env:RUNNER_TEMP\$project"
            git init -q
            git add -A
            git -c user.name=CI -c user.email=ci@example.com commit -q -m "Baseline before the build"
            Pop-Location
          }

      # PowerShell, not bash: setup-msbuild puts msbuild on the Windows PATH,
      # and Git Bash would also rewrite /p: switches as if they were paths.
      - name: Build the app project with MSBuild
        shell: pwsh
        run: |
          $platform = if ($env:RUNNER_ARCH -eq 'ARM64' -or $env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'ARM64' } else { 'x64' }
          foreach ($config in @('Debug', 'Release')) {
            # RunTests=true builds the solution and then runs the test
            # program, so a failing test fails the build.
            msbuild "$env:RUNNER_TEMP\vsapp\vsapp.sln" -p:Configuration=$config -p:Platform=$platform -m -p:RunTests=true | Tee-Object -Variable log
            if ($LASTEXITCODE -ne 0) { throw "msbuild failed for vsapp ($config)" }
            # The solution must build without CMake.
            if ($log -match 'cmake(\.exe)?"?\s+-') { throw "the Visual Studio build of vsapp ran CMake" }
            # The wildcards are supported because the project is read-only.
            if ($log -match 'Wildcards and/or some other MSBuild constructs') { throw "the Visual Studio build of vsapp warned about wildcards" }
            # The tests are a project of the solution, and they ran.
            $testsExe = "$env:RUNNER_TEMP\vsapp\build\vs\$platform\$config\vsapp_tests\vsapp_tests.exe"
            if (-not (Test-Path -LiteralPath $testsExe)) { throw "the Visual Studio project built no test program ($config)" }
            # doctest wraps the line in ANSI colour codes.
            if (($log | Out-String) -notmatch 'Status:.*SUCCESS!') { throw "the unit tests built by Visual Studio did not pass ($config)" }
            # C4335: a source file with lone CRs, which the generator must never write.
            if (($log | Out-String) -match 'C4335') { throw "a generated source file has broken line endings (C4335, $config)" }
            Push-Location "$env:RUNNER_TEMP\vsapp"
            $extra = git status --porcelain --ignored | Where-Object { $_ -notmatch '^!! build/' }
            Pop-Location
            if ($extra) { $extra; throw "msbuild wrote files outside build/vs" }
          }

      - name: MSBuild and CMake write the same version.hpp
        # The .vcxproj fills in cmake/templates/version.hpp.in itself, in
        # plain MSBuild, so it never runs CMake. The two copies of that logic
        # must agree. The git description differs (the project became a git
        # repository between the two builds) and is masked out, as are the
        # line endings.
        shell: pwsh
        run: |
          $project = "$env:RUNNER_TEMP\vsapp"
          # Compared line by line: MSBuild and CMake differ in line endings, a
          # byte-order mark and blank lines, none of which matters to the
          # compiler.
          function Get-Lines([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path)) { throw "missing: $Path" }
            $text = [System.IO.File]::ReadAllText($Path).TrimStart([char]0xFEFF)
            return @($text -split "`r?`n" |
              ForEach-Object { $_.TrimEnd() } |
              Where-Object { $_ -ne '' } |
              ForEach-Object { $_ -replace 'kGitHash = "[^"]*"', 'kGitHash = "<git>"' })
          }
          $fromCMake = Get-Lines "$project\build\release\generated\include\vsapp\version.hpp"
          $fromMSBuild = Get-Lines "$project\build\vs\generated\vsapp\version.hpp"
          $diff = Compare-Object -ReferenceObject $fromCMake -DifferenceObject $fromMSBuild -CaseSensitive -SyncWindow 0
          if ($diff) {
            # <= only in the CMake header, => only in the MSBuild one
            $diff | Format-Table -AutoSize | Out-String -Width 200
            throw "the Visual Studio project and CMake generate different version.hpp files"
          }

      - name: A new source file is still discovered
        shell: pwsh
        run: |
          # Automatic discovery has to survive the read-only project: add a
          # file under src/ and build again. MSBuild evaluates the wildcard on
          # every run, so no project edit or IDE reload is needed here.
          $source = "$env:RUNNER_TEMP\vsapp\src\vsapp\core\discovered.cpp"
          @'
          namespace vsapp::core
          {
              int discovered()
              {
                  return 1;
              }
          }
          '@ | Set-Content -LiteralPath $source -Encoding utf8
          $platform = if ($env:RUNNER_ARCH -eq 'ARM64' -or $env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'ARM64' } else { 'x64' }
          msbuild "$env:RUNNER_TEMP\vsapp\vsapp.sln" -p:Configuration=Release -p:Platform=$platform -m | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed after adding a source file" }
          if ($log -match 'Wildcards and/or some other MSBuild constructs') { throw "the rebuild warned about wildcards" }
          $obj = Get-ChildItem "$env:RUNNER_TEMP\vsapp\build\vs\obj" -Recurse -Filter discovered.obj
          if (-not $obj) { throw "the new source file src/vsapp/core/discovered.cpp was not compiled" }

      - name: Build the library project with MSBuild
        shell: pwsh
        run: |
          $platform = if ($env:RUNNER_ARCH -eq 'ARM64' -or $env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'ARM64' } else { 'x64' }
          foreach ($config in @('Debug', 'Release')) {
            msbuild "$env:RUNNER_TEMP\vslib\vslib.sln" -p:Configuration=$config -p:Platform=$platform -m -p:RunTests=true | Tee-Object -Variable log
            if ($LASTEXITCODE -ne 0) { throw "msbuild failed for vslib ($config)" }
            # The solution must build without CMake.
            if ($log -match 'cmake(\.exe)?"?\s+-') { throw "the Visual Studio build of vslib ran CMake" }
            # The wildcards are supported because the project is read-only.
            if ($log -match 'Wildcards and/or some other MSBuild constructs') { throw "the Visual Studio build of vslib warned about wildcards" }
            # A library project has tests too, and they ran.
            $testsExe = "$env:RUNNER_TEMP\vslib\build\vs\$platform\$config\vslib_tests\vslib_tests.exe"
            if (-not (Test-Path -LiteralPath $testsExe)) { throw "the library project built no test program ($config)" }
            if (($log | Out-String) -notmatch 'Status:.*SUCCESS!') { throw "the unit tests of vslib did not pass ($config)" }
            # C4335: a source file with lone CRs, which the generator must never write.
            if (($log | Out-String) -match 'C4335') { throw "a generated source file has broken line endings (C4335, $config)" }
            Push-Location "$env:RUNNER_TEMP\vslib"
            $extra = git status --porcelain --ignored | Where-Object { $_ -notmatch '^!! build/' }
            Pop-Location
            if ($extra) { $extra; throw "msbuild wrote files outside build/vs" }
          }

      - name: Build the project of the PowerShell script with MSBuild
        shell: pwsh
        run: |
          $platform = if ($env:RUNNER_ARCH -eq 'ARM64' -or $env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'ARM64' } else { 'x64' }
          msbuild "$env:RUNNER_TEMP\psapp-pwsh\vsapp.sln" -p:Configuration=Release -p:Platform=$platform -m | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed for the project of the PowerShell script" }
          # The solution must build without CMake.
          if ($log -match 'cmake(\.exe)?"?\s+-') { throw "the Visual Studio build of the PowerShell project ran CMake" }
          # The wildcards are supported because the project is read-only.
          if ($log -match 'Wildcards and/or some other MSBuild constructs') { throw "the Visual Studio build of the PowerShell project warned about wildcards" }

      - name: The project without vcpkg builds with MSBuild
        # A project without vcpkg has no manifest, so the vcpkg integration has
        # to stay out of the way even though vcpkg is installed on the runner.
        shell: pwsh
        run: |
          $project = "$env:RUNNER_TEMP\vsnovcpkg"
          if (Test-Path -LiteralPath "$project\vcpkg.json") {
            throw "the project without vcpkg still has a manifest"
          }
          $projectFile = Get-Content -LiteralPath "$project\vsnovcpkg.vcxproj" -Raw
          if ($projectFile -notmatch 'VcpkgEnableManifest Condition="!Exists\(') {
            throw "the project without vcpkg does not turn the vcpkg manifest mode off"
          }
          $platform = if ($env:RUNNER_ARCH -eq 'ARM64' -or $env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'ARM64' } else { 'x64' }
          msbuild "$project\vsnovcpkg.sln" -p:Configuration=Release -p:Platform=$platform -m -p:RunTests=true | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) { throw "msbuild failed for the project without vcpkg" }
          if ($log -match 'Wildcards and/or some other MSBuild constructs') { throw "the Visual Studio build of the project without vcpkg warned about wildcards" }
          # The program lands in a folder of its own, so that the app and the
          # test program of the same solution do not write over each other.
          if (-not (Test-Path -LiteralPath "$project\build\vs\$platform\Release\vsnovcpkg\vsnovcpkg.exe")) {
            throw "the project without vcpkg produced no executable"
          }
          # Without a manifest the tests take doctest from the pinned download,
          # and they ran.
          if (-not (Test-Path -LiteralPath "$project\build\vs\third_party\doctest\doctest.h")) {
            throw "the project without vcpkg did not download doctest"
          }
          if (-not (Test-Path -LiteralPath "$project\build\vs\$platform\Release\vsnovcpkg_tests\vsnovcpkg_tests.exe")) {
            throw "the project without vcpkg produced no test program"
          }
          if (($log | Out-String) -notmatch 'Status:.*SUCCESS!') { throw "the tests of the project without vcpkg did not pass" }

      - name: A corrupted doctest header fails the build
        # The header is checked against a pinned SHA-256 on every build, so a
        # half-downloaded or tampered file is caught instead of compiled.
        shell: pwsh
        run: |
          $project = "$env:RUNNER_TEMP\vsnovcpkg"
          $platform = if ($env:RUNNER_ARCH -eq 'ARM64' -or $env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'ARM64' } else { 'x64' }
          $header = "$project\build\vs\third_party\doctest\doctest.h"
          Add-Content -LiteralPath $header -Value "// corrupted by the template test"
          msbuild "$project\vsnovcpkg.sln" -p:Configuration=Release -p:Platform=$platform -m | Tee-Object -Variable log
          if ($LASTEXITCODE -eq 0) { throw "the build accepted a doctest header with the wrong hash" }
          if ($log -notmatch 'not the pinned one') { throw "the build failed without naming the doctest hash" }
