name: Feature request
description: Something that should exist or work differently
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would solve it? Alternatives you considered are welcome too.
