# git-cliff configuration: the release notes of a tagged release, written from
# the commit subjects since the previous tag (release-build.yml runs it).
#   git cliff --latest --strip header        notes of the newest tag
#   git cliff --unreleased                   what the next release will carry
# Commit subjects here are plain imperative sentences ("Fix ...", "Add ..."),
# not Conventional Commits, so they are grouped by their first word.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "^v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^Merge ", skip = true },
  { message = "(?i)^(add|support|introduce|allow)", group = "<!-- 0 -->Added" },
  { message = "(?i)^fix", group = "<!-- 2 -->Fixed" },
  { message = "(?i)^(remove|drop|delete)", group = "<!-- 3 -->Removed" },
  { message = "(?i)^(document|docs)", group = "<!-- 4 -->Documentation" },
  { message = ".*", group = "<!-- 1 -->Changed" },
]
