# lychee link checker settings (the docs-lint workflow):
#   lychee --config lychee.toml "./**/*.md"

# Wiki pages link to each other without the .md (GitHub's wiki style):
# [Getting started](Getting-Started) is wiki/Getting-Started.md.
fallback_extensions = ["md"]

exclude_path = ["build", "docs", "vcpkg_installed", "node_modules"]

exclude = [
  # Placeholders the generator fills in, and examples of user-specific URLs.
  '@GITHUB_USER@',
  'your-github-user',
  '<user>',
  '<owner>',
  '^https?://localhost',
  '^https?://127\.0\.0\.1',
  # The published docs site and wiki only exist after the first publish.
  '^https://[a-z0-9-]+\.github\.io/',
  # Pages that answer link checkers with an error or a login wall.
  '^https://learn\.microsoft\.com/.*\?view=',
]

# Rate limits (429) mean "slow down", not "broken".
accept = ["200..=299", "429"]
max_retries = 3
timeout = 30
