# Install once per clone with:  pre-commit install
# Run against everything with:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files

  # Keep the local hook in step with the CI format job and .clang-format (v20+).
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.5
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]

  # CMake style and naming, with the rules in .cmake-format.yaml. A local hook
  # rather than a pinned repository: it uses the cmake-lint you install with
  # pipx (see the wiki), and cmakelang 0.6.13 is old enough that a managed
  # environment is not always reliable on the latest Python. Formatting stays
  # off; only the lint runs.
  - repo: local
    hooks:
      - id: cmake-lint
        name: cmake-lint
        entry: cmake-lint
        language: system
        types: [file]
        files: '(^|/)CMakeLists\.txt$|\.cmake(\.in)?$'
