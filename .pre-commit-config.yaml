# Install once per clone with:  pre-commit install
# Run against everything with:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files

  # Keep the local hook in step with the CI format job and .clang-format (v20+).
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.5
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]

  # CMake style and naming, with the rules in .cmake-format.yaml. The tool
  # comes from the environment pre-commit builds for this hook, so a fresh
  # clone can commit without cmakelang on the PATH; pyyaml is needed to read
  # the YAML config.
  - repo: local
    hooks:
      - id: cmake-lint
        name: cmake-lint
        entry: cmake-lint
        language: python
        additional_dependencies: [cmakelang==0.6.13, pyyaml]
        types: [file]
        files: '(^|/)CMakeLists\.txt$|\.cmake(\.in)?$'
